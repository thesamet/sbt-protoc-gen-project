name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-java@v5
      with:
          java-version: 17
          distribution: temurin
    - uses: sbt/setup-sbt@v1

    - name: Formatting
      run: |
        sbt ";scalafmtCheckAll;scalafmtSbtCheck"

    - name: Compile and test
      run: |
        sbt +scripted
  # Single final job for mergify.
  ci-passed:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - run: ':'
